<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive Lamp Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        roomDark: '#090a0f',
                        roomLight: '#f3f4f6',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Custom lamp glow effects */
        .lamp-glow {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Lava lamp blob animation */
        @keyframes blob1 {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-40px) scale(1.2, 0.8); }
        }
        @keyframes blob2 {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-60px) scale(0.9, 1.3); }
        }
        @keyframes blob3 {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1, 0.9); }
        }
        .animate-blob1 { animation: blob1 7s infinite ease-in-out; }
        .animate-blob2 { animation: blob2 9s infinite ease-in-out; }
        .animate-blob3 { animation: blob3 5s infinite ease-in-out; }

        /* Neon flicker */
        @keyframes neonFlicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% {
                opacity: 0.99;
                filter: drop-shadow(0 0 15px currentColor) drop-shadow(0 0 30px currentColor);
            }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% {
                opacity: 0.4;
                filter: none;
            }
        }
        .neon-active {
            animation: neonFlicker 4s infinite;
        }

        /* Chandelier sparkle */
        @keyframes sparkle {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.15); filter: brightness(1.3); }
        }
        .sparkle-effect {
            animation: sparkle 2s infinite ease-in-out;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body id="appBody" class="bg-roomDark text-slate-100 min-h-screen flex flex-col overflow-x-hidden">

    <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">

        <!-- Right Sidebar: Lamp Selector & Controls -->

                </div>

    </main>

    <script>
        // Audio Synthesizer for interactive feedback (Click, Switch, Hum)
        let audioEnabled = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.05);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'switch') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.setValueAtTime(500, now + 0.03);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                }
            } catch (e) {
                console.log('Audio playback prevented or not supported', e);
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const icon = document.getElementById('audioIcon');
            if (audioEnabled) {
                initAudio();
                icon.className = 'fa-solid fa-volume-high text-amber-400';
                playSound('click');
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
            }
        }

        // Lamp Database Definitions
        const lamps = [

                desc: 'A classic warm-glow filament bulb designed for rustic ambiance and timeless charm.',

                    return `

                                 box-shadow: ${on ? `0 0 ${60 * (brightness/100)}px ${20 * (brightness/100)}px ${color}aa, inset 0 0 25px rgba(255,255,255,0.5)` : 'none'}">

                                <div class="relative w-12 h-20 flex items-center justify-center">

                                         style="box-shadow: ${on ? `0 0 10px ${color}` : 'none'}"></div>
                                    <div class="w-2 h-10 bg-amber-200 ${on ? 'shadow-[0_0_15px_#fff]' : ''}"></div>
                                </div>
                            </div>

            {

                                ${on ? `

                                    <div class="absolute inset-0 overflow-hidden opacity-90">
                                        <div class="absolute bottom-4 left-4 w-16 h-20 rounded-full animate-blob1" style="background-color: ${color}; filter: blur(4px);"></div>
                                        <div class="absolute bottom-16 right-4 w-14 h-16 rounded-full animate-blob2" style="background-color: ${color}; filter: blur(5px);"></div>
                                        <div class="absolute bottom-28 left-6 w-12 h-16 rounded-full animate-blob3" style="background-color: ${color}; filter: blur(3px);"></div>

            {

                render: (on, color, brightness) => {
                    return `

                                 box-shadow: ${on ? `0 0 ${70 * (brightness/100)}px ${25 * (brightness/100)}px ${color}aa, inset 0 0 35px rgba(255,255,255,0.8)` : '0 10px 20px rgba(0,0,0,0.3)'}">
                                <!-- Ribbing rings pattern -->
                                <div class="absolute inset-0 rounded-full border-b-2 border-t-2 border-stone-800/20 pointer-events-none"></div>

                            </div>
                            <!-- Bottom Tassel -->
                            <div class="w-1 h-8 bg-stone-600 mt-0.5"></div>

            },
            {
                id: 'chandelier',
                name: 'Crystal Chandelier',
                icon: 'fa-gem',
                desc: 'An opulent multi-tier crystal fixture radiating sparkling luxury and elegance.',
                defaultColor: '#fff5cc',
                render: (on, color, brightness) => {
                    return `
                        <div class="flex flex-col items-center">
                            <!-- Chain -->
                            <div class="w-1 h-16 bg-gradient-to-b from-amber-700 to-yellow-500"></div>
                            <!-- Crown frame -->
                            <div class="w-48 h-12 rounded-t-full border-t-4 border-amber-500 flex items-center justify-around px-4 shadow-lg">
                                <div class="w-3 h-6 bg-amber-300 rounded-b-full ${on ? 'sparkle-effect' : ''}" style="background-color: ${on ? color : '#888'}; box-shadow: ${on ? `0 0 15px ${color}` : 'none'}"></div>
                                <div class="w-3 h-8 bg-amber-300 rounded-b-full ${on ? 'sparkle-effect' : ''}" style="background-color: ${on ? color : '#888'}; box-shadow: ${on ? `0 0 15px ${color}` : 'none'}"></div>

                render: (on, color, brightness) => {
                    return `
                        <div class="relative flex items-center">

                                <div class="w-16 h-20 rounded-full border-4 border-zinc-600 flex items-center justify-center transition-all duration-300"

                                     box-shadow: ${on ? `0 0 ${90 * (brightness/100)}px ${40 * (brightness/100)}px ${color}` : 'none'}">

        ];

        // State Management
        let currentLampId = 'edison';
        let lampStates = {}; // id -> { on: boolean, brightness: number, color: string }
        let masterPower = true;
        let roomMode = 'dark'; // 'dark' or 'light'

        // Initialize default states
        lamps.forEach(lamp => {
            lampStates[lamp.id] = {
                on: true,
                brightness: 100,
                color: lamp.defaultColor
            };
        });

        // DOM Elements
        const lampStage = document.getElementById('lampStage');
        const lampSelectorGrid = document.getElementById('lampSelectorGrid');
        const activeLampBadge = document.getElementById('activeLampBadge');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const brightnessVal = document.getElementById('brightnessVal');
        const colorPicker = document.getElementById('colorPicker');
        const colorHexText = document.getElementById('colorHexText');
        const lampInfoTitle = document.getElementById('lampInfoTitle');
        const lampInfoDesc = document.getElementById('lampInfoDesc');
        const controlPowerStatusText = document.getElementById('controlPowerStatusText');
        const controlPowerIconBox = document.getElementById('controlPowerIconBox');
        const catalogPowerBtn = document.getElementById('catalogPowerBtn');
        const catalogPowerKnob = document.getElementById('catalogPowerKnob');
        const roomContainer = document.getElementById('roomContainer');
        const roomAmbientGlow = document.getElementById('roomAmbientGlow');
        const appBody = document.getElementById('appBody');
        const roomModeBtn = document.getElementById('roomModeBtn');
        const roomModeIcon = document.getElementById('roomModeIcon');
        const roomModeText = document.getElementById('roomModeText');

        // Render Selector Buttons
        function renderSelectorGrid() {
            lampSelectorGrid.innerHTML = '';
            lamps.forEach(lamp => {
                const isActive = lamp.id === currentLampId;
                const state = lampStates[lamp.id];
                const btn = document.createElement('button');
                btn.className = `p-3 rounded-xl border flex flex-col items-center justify-center space-y-2 transition-all ${
                    isActive 
                        ? 'bg-amber-500/20 border-amber-500 text-amber-300 shadow-lg shadow-amber-500/10' 
                        : 'bg-white/5 border-white/10 hover:bg-white/10 text-slate-300'
                }`;
                btn.onclick = () => selectLamp(lamp.id);
                btn.innerHTML = `
                    <div class="relative">
                        <i class="fa-solid ${lamp.icon} text-lg"></i>
                        ${state.on ? `<span class="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>` : ''}
                    </div>
                    <span class="text-xs font-medium text-center leading-tight">${lamp.name}</span>
                `;
                lampSelectorGrid.appendChild(btn);
            });
        }

        function selectLamp(id) {
            playSound('click');
            currentLampId = id;
            updateUI();
        }

        function toggleActiveLampPower() {
            playSound('switch');
            const state = lampStates[currentLampId];
            state.on = !state.on;
            updateUI();
        }

        function toggleMasterPower() {
            playSound('switch');
            masterPower = !masterPower;
            const btn = document.getElementById('masterPowerBtn');
            if (masterPower) {
                btn.className = 'px-4 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-semibold text-xs flex items-center space-x-2 shadow-lg shadow-amber-500/20 transition';
            } else {
                btn.className = 'px-4 py-1.5 rounded-lg bg-zinc-700 hover:bg-zinc-600 text-slate-300 font-semibold text-xs flex items-center space-x-2 transition';
            }
            updateUI();
        }

        function updateBrightness(val) {
            const state = lampStates[currentLampId];
            state.brightness = parseInt(val);
            brightnessVal.textContent = val + '%';
            updateUI(false); // skip re-render of full stage if unnecessary, or update glow
        }

        function updateColor(hex) {
            const state = lampStates[currentLampId];
            state.color = hex;
            colorHexText.textContent = hex;
            updateUI();
        }

        function setPresetColor(hex) {
            playSound('click');
            colorPicker.value = hex;
            updateColor(hex);
        }

        function resetLampSettings() {
            playSound('click');
            const lamp = lamps.find(l => l.id === currentLampId);
            const state = lampStates[currentLampId];
            state.on = true;
            state.brightness = 100;
            state.color = lamp.defaultColor;
            updateUI();
        }

        function toggleRoomMode() {
            playSound('click');
            roomMode = roomMode === 'dark' ? 'light' : 'dark';
            if (roomMode === 'light') {
                appBody.className = 'bg-roomLight text-slate-900 min-h-screen flex flex-col overflow-x-hidden';
                roomContainer.classList.remove('bg-roomDark');
                roomContainer.classList.add('bg-roomLight');
                roomModeIcon.className = 'fa-solid fa-sun text-amber-500';
                roomModeText.textContent = 'Bright Room';
            } else {
                appBody.className = 'bg-roomDark text-slate-100 min-h-screen flex flex-col overflow-x-hidden';
                roomContainer.classList.remove('bg-roomLight');
                roomContainer.classList.add('bg-roomDark');
                roomModeIcon.className = 'fa-solid fa-moon';
                roomModeText.textContent = 'Dark Room';
            }
        }

        // Main UI Updater
        function updateUI() {
            const lamp = lamps.find(l => l.id === currentLampId);
            const state = lampStates[currentLampId];
            const effectivelyOn = masterPower && state.on;

            // Render Lamp HTML
            lampStage.innerHTML = lamp.render(effectivelyOn, state.color, state.brightness);

            // Update badge & info
            activeLampBadge.textContent = lamp.name;
            lampInfoTitle.textContent = lamp.name;
            lampInfoDesc.textContent = lamp.desc;

            // Update controls
            brightnessSlider.value = state.brightness;
            brightnessVal.textContent = state.brightness + '%';
            colorPicker.value = state.color;
            colorHexText.textContent = state.color;

            // Power button toggle UI state
            if (state.on) {
                controlPowerStatusText.textContent = 'ON';
                controlPowerStatusText.className = 'text-xs text-amber-400 font-medium';
                controlPowerIconBox.className = 'w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center';
                catalogPowerBtn.className = 'w-12 h-6 rounded-full bg-amber-500 relative transition-colors duration-200 focus:outline-none';
                catalogPowerKnob.style.left = '1.75rem';
            } else {
                controlPowerStatusText.textContent = 'OFF';
                controlPowerStatusText.className = 'text-xs text-slate-500 font-medium';
                controlPowerIconBox.className = 'w-8 h-8 rounded-lg bg-white/5 text-slate-500 flex items-center justify-center';
                catalogPowerBtn.className = 'w-12 h-6 rounded-full bg-zinc-700 relative transition-colors duration-200 focus:outline-none';
                catalogPowerKnob.style.left = '0.25rem';
            }

            // Room ambient background glow based on lamp color & brightness
            if (effectivelyOn) {
                roomAmbientGlow.style.opacity = (state.brightness / 100) * (roomMode === 'dark' ? 0.45 : 0.15);
                roomAmbientGlow.style.background = `radial-gradient(circle at 50% 50%, ${state.color}aa 0%, transparent 70%)`;
            } else {
                roomAmbientGlow.style.opacity = '0';
            }

            renderSelectorGrid();
        }

        // Initial render on load
        window.onload = function() {
            updateUI();
        };
    </script>
</body>
</html>
